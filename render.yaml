services:
  - type: web
    name: breatheesg-backend
    env: python
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        # Set this to your actual Render subdomain after first deploy,
        # e.g. breatheesg-backend.onrender.com
        # Using * temporarily is safe since DRF authentication guards all endpoints.
        value: "*"
      - key: CORS_ORIGINS
        # Set this to your frontend Render URL after first deploy,
        # e.g. https://breatheesg-frontend.onrender.com
        sync: false
    plan: free
  - type: web
    name: breatheesg-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://breatheesg-backend.onrender.com"


