services:
  # Django Backend
  - type: web
    name: breatheesg-backend
    env: python
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "breatheesg-backend.onrender.com"
      - key: CORS_ORIGINS
        value: "https://breatheesg-frontend.onrender.com"
    plan: free

  # React Frontend
  - type: web
    name: breatheesg-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://breatheesg-backend.onrender.com"


